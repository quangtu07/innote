[package]
name = "innote"
version = "0.7.1"
description = "Innote — ghi chép cuộc họp trên máy của bạn"
edition = "2021"
default-run = "innote"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
wasapi = "0.26"
hound = "3.5"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["net", "time", "macros", "rt", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
libloading = "0.8"
windows = { version = "0.62", features = ["Win32_System_Performance", "Win32_System_Threading", "Win32_Security", "Win32_Media_MediaFoundation"] }
rfd = "0.15"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
